services:
  myDB:
    image: postgres:15.3
    container_name: users-products-app
    restart: always
    ports:
      - 5433:5432
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=123456
      - POSTGRES_DB=proyecto-integrador-db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d proyecto-integrador-db"]
      interval: 5s
      timeout: 5s
    
      retries: 10
      start_period: 10s
    volumes:
      - ./postgres:/var/lib/postgresql/data
  
  pdAdmin:
    image: dpage/pgadmin4
    container_name: pgadmin-proyecto-integrador-db
    restart: always
    depends_on:
      - myDB
    ports:
      - 8081:80
    environment:
      - PGADMIN_DEFAULT_EMAIL=user@google.com
      - PGADMIN_DEFAULT_PASSWORD=123456
    volumes:
      - ./pgadmin:/var/lib/pgadmin
      - ./pgadmin:/certs/server.cert
      - ./pgadmin:/certs/server.key
      - ./pgadmin:/pgadmin4/servers.json